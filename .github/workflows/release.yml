name: Release
on:
  push:
    branches: [main]
  # Re-run the packager for an existing tag, e.g. after a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, e.g. v1.0.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      # Uploads to CurseForge and Wago when their project IDs
      # (TOC) and tokens (secrets) are set, and to the GitHub release.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # The packager skips branch pushes that have a tag at HEAD, expecting
          # a separate tag-triggered run. Tags made by release-please never
          # trigger one, so present this run as the tag build.
          GITHUB_REF: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
